<!DOCTYPE html>
<html>
<head>
    <title>Squares and Cubes</title>
</head>
<body>

<h2>Squares and Cubes</h2>

<table border="1">
    <tr>
        <th>Number</th>
        <th>Square</th>
        <th>Cube</th>
    </tr>

    <script>
        var n = prompt("Enter a number:");

        for (var i = 0; i <= n; i++) {
            document.write("<tr>");
            document.write("<td>" + i + "</td>");
            document.write("<td>" + (i * i) + "</td>");
            document.write("<td>" + (i * i * i) + "</td>");
            document.write("</tr>");
        }
    </script>
</table>
